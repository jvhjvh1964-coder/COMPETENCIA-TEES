<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competencia Cuentas T - Contabilidad</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --fondo: #101522;
  --panel: #1b2435;
  --azul: #087cff;
  --rojo: #f01932;
  --verde: #00c878;
  --amarillo: #ffe600;
}

body {
  margin: 0;
  background: var(--fondo);
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

header {
  padding: 10px;
  text-align: center;
  background: #080c15;
  border-bottom: 3px solid #ffe600;
}

header h1 {
  margin: 5px;
  font-size: clamp(20px, 3vw, 34px);
  color: #ffe600;
}

#cronometro {
  font-size: clamp(22px, 3vw, 32px);
  font-weight: bold;
  color: white;
  margin: 8px;
}

#pantallas {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  padding: 5px;
  min-height: 82vh;
}

.lado {
  position: relative;
  min-width: 0;
  padding: 10px;
  background: var(--panel);
  border: 3px solid #60708a;
  border-radius: 12px;
  overflow: hidden;
}

.lado h2 {
  text-align: center;
  color: #ffe600;
  margin: 5px 0 10px;
  font-size: clamp(17px, 2vw, 26px);
}


/* Fila superior de cada división */
.encabezado-division {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}

/* Emoji a la izquierda */
.encabezado-division h2 {
  margin: 0;
  text-align: left;
  font-size: clamp(24px, 3vw, 38px);
}

/* Cronómetro a la derecha */
.cronometro-division {
  font-size: clamp(16px, 2vw, 25px);
  font-weight: 900;
  color: white;
  text-align: right;
  white-space: nowrap;
}

.progreso {
  text-align: center;
  font-weight: bold;
  font-size: 15px;
  margin: 8px 0;
}

.estadisticas {
  display: flex;
  justify-content: space-around;
  gap: 5px;
  flex-wrap: wrap;
  font-weight: bold;
  margin-bottom: 10px;
}

.estadisticas span {
  padding: 5px 8px;
  border-radius: 6px;
  background: #080c15;
  font-size: 13px;
}

.cuenta {
  width: 100%;
  max-width: 460px;
  margin: 0 auto 12px;
  border: 3px solid white;
  border-radius: 8px;
  background: #f5f7fb;
  color: #111;
  padding: 8px;
}

.cuenta h3 {
  text-align: center;
  margin: 0 0 8px;
  font-size: 18px;
}

.columnas {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.columna {
  min-width: 0;
  border: 2px solid #333;
  border-radius: 5px;
  overflow: hidden;
}

.columna h4 {
  margin: 0;
  padding: 7px 2px;
  color: white;
  text-align: center;
  font-size: clamp(13px, 1.6vw, 18px);
}

.debe h4 {
  background: #087cff;
}

.haber h4 {
  background: #ed243b;
}

.valores {
  text-align: center;
  padding: 5px 2px;
  font-size: clamp(15px, 1.8vw, 21px);
  font-weight: bold;
  line-height: 1.65;
  background: white;
  color: #111;
}

.total {
  border-top: 2px solid #333;
  text-align: center;
  padding: 5px 1px;
  font-weight: bold;
  font-size: clamp(13px, 1.6vw, 18px);
  background: #e5eaf2;
}

.recuadros {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 9px;
}

.recuadro {
  min-width: 0;
  min-height: 48px;
  border: 3px dashed #566579;
  border-radius: 7px;
  background: #dce4ef;
  color: #222;
  font-size: clamp(11px, 1.4vw, 15px);
  font-weight: bold;
  cursor: pointer;
  padding: 5px 2px;
  overflow-wrap: anywhere;
}

.recuadro.saldo {
  grid-column: 1 / -1;
  min-height: 42px;
}

.recuadro.lleno {
  border-style: solid;
  border-color: #00b76b;
  background: #baffd9;
}


/* Agrandar solamente los valores monetarios ubicados */
.recuadro .valor-destino {
  font-size: clamp(24px, 3vw, 36px);
  font-weight: 900;
  line-height: 1.2;
  display: inline-block;
}


/* Quitar el borde amarillo de los recuadros */
.recuadro.seleccionado {
  outline: none;
}

.piezas-titulo {
  text-align: center;
  color: #ffe600;
  font-weight: bold;
  font-size: 15px;
  margin: 12px 0 7px;
}

.piezas {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  max-width: 460px;
  margin: auto;
}

.pieza {
  min-height: 48px;
  padding: 8px 4px;
  border: 3px solid white;
  border-radius: 8px;
  color: white;
  font-weight: bold;

  //font-size: clamp(12px, 1.5vw, 16px);
  font-size: clamp(20px, 2.5vw, 30px);

  cursor: pointer;
  overflow-wrap: anywhere;
  box-shadow: 0 3px 0 #0008;
}


/* Colores disponibles para las seis piezas */
.pieza.color-1 { background: #087cff; color: white; }
.pieza.color-2 { background: #ed243b; color: white; }
.pieza.color-3 { background: #087c43; color: white; }
.pieza.color-4 { background: #f6fa05; color: black; }
.pieza.color-5 { background: #e58b00; color: white; }
.pieza.color-6 { background: #00a6a6; color: white; }


.pieza:disabled {
  opacity: 0.3;
  cursor: default;
  box-shadow: none;
}

.pieza.elegida {
  outline: 4px solid #ffe600;
  transform: scale(1.04);
}

footer {
  text-align: center;
  padding: 14px 5px;
  background: #080c15;
  color: white;
  font-weight: bold;
  font-size: clamp(11px, 1.7vw, 16px);
  border-top: 3px solid #ffe600;
}

/* INICIO Y EFECTOS EMERGENTES */

#inicio {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
  animation: ocultarInicio 1s ease-in-out forwards;
}

#robot {
  font-size: 10vw;
  animation: zoomRobot 1s ease-in-out forwards;
}

@keyframes zoomRobot {
  0% {
    transform: scale(0.15) rotate(-15deg);
    opacity: 0.3;
  }
  60% {
    opacity: 1;
  }
  100% {
    transform: scale(15) rotate(0deg);
    opacity: 0;
  }
}

@keyframes ocultarInicio {
  0%, 85% { visibility: visible; }
  100% { visibility: hidden; }
}

#efecto {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 900;
  justify-content: center;
  align-items: center;
  pointer-events: none;
  font-size: clamp(100px, 20vw, 240px);
  font-weight: bold;
}

#efecto.mostrar {
  display: flex;
  animation: zoomRespuesta 0.3s ease-out forwards;
}

#efecto.correcto {
  color: #087cff;
  text-shadow: 0 0 25px #087cff;
}

#efecto.incorrecto {
  color: #f01932;
  text-shadow: 0 0 25px #f01932;
}

@keyframes zoomRespuesta {
  0% {
    transform: scale(0.1);
    opacity: 0;
  }
  55% {
    transform: scale(1.15);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 0;
  }
}


/* RAYO U OTRO EMOJI ANIMADO EN LA PARTE SUPERIOR */
#rayo {
  position: fixed;
  top: 5px;
  left: 0;
  z-index: 850;
  pointer-events: none;
  user-select: none;
  opacity: 0;
  font-size: clamp(45px, 7vw, 90px);
  line-height: 1;
  filter:
    drop-shadow(0 0 8px #00eaff)
    drop-shadow(0 0 18px #087cff);
  white-space: nowrap;
}

/* Rayo u otro emoji que viaja de derecha a izquierda */
#rayo.hacia-izquierda {
  animation: rayoIzquierda 1.1s ease-in-out forwards;
}

/* Rayo u otro emoji que viaja de izquierda a derecha */
#rayo.hacia-derecha {
  animation: rayoDerecha 1.1s ease-in-out forwards;
}

@keyframes rayoIzquierda {
  0% {
    transform: translateX(calc(100vw + 100px)) rotate(15deg);
    opacity: 0;
  }

  15% {
    opacity: 1;
  }

  85% {
    opacity: 1;
  }

  100% {
    transform: translateX(-120px) rotate(-15deg);
    opacity: 0;
  }
}

@keyframes rayoDerecha {
  0% {
    transform: translateX(-120px) rotate(-15deg);
    opacity: 0;
  }

  15% {
    opacity: 1;
  }

  85% {
    opacity: 1;
  }

  100% {
    transform: translateX(calc(100vw + 100px)) rotate(15deg);
    opacity: 0;
  }
}



/* NOTA FINAL PERMANENTE */

.final {
  position: absolute;
  inset: 0;
  z-index: 50;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;

  background: #ffffff;
  color: #087cff;
  border: 8px solid #f01932;
  border-radius: 15px;

  font-size: clamp(28px, 4vw, 48px);
  font-weight: 900;
  line-height: 1.5;

  text-shadow: none;
  box-shadow: inset 0 0 12px #f01932;
  padding: 15px;
}


/* NOTA FINAL TRIPLE DE TAMAÑO */

.final .calificacion {
  font-size: clamp(84px, 12vw, 144px);
  line-height: 1.2;
  font-weight: 900;
}


/* RULETA FINAL DE CUATRO COLORES */


.ruleta-contenedor {
  position: relative;
  width: clamp(260px, 35vw, 400px);
  aspect-ratio: 1 / 1;
  margin: 20px auto;
  display: flex;
  align-items: center;
  justify-content: center;
}



/* PUNTERO NEGRO GRANDE EN EL BORDE SUPERIOR */
.puntero-ruleta {
  position: absolute;

  /* Centrar el puntero en el borde superior */
  top: -12px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 10;

  /* Agrandar el triángulo */
  width: 0;
  height: 0;

  border-left: 24px solid transparent;
  border-right: 24px solid transparent;
  border-top: 44px solid #000000;

  /* Resplandor blanco */
  filter:
    drop-shadow(0 0 3px #ffffff)
    drop-shadow(0 0 6px #000000);
}


.nota-centro {
  position: relative;
  z-index: 2;
  width: 43%;
  aspect-ratio: 1 / 1;
  border: 5px solid #111111;
  border-radius: 50%;
  background: #ffffff;
  color: #087cff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  box-shadow: 0 0 12px #111111;
  font-size: clamp(12px, 1.6vw, 18px);
  font-weight: 900;
}

/* NOTA FINAL MUCHO MÁS GRANDE EN EL CENTRO */
.nota-centro .valor-nota {
  font-size: clamp(42px, 7vw, 76px);
  line-height: 1;
  font-weight: 900;
  color: #f01932;
  text-align: center;
  white-space: nowrap;
  text-shadow: 0 0 4px #ffe600;
}

.ruleta {
  position: absolute;
  inset: 0;
  border: 5px solid #ffffff;
  border-radius: 50%;
  background: conic-gradient(
    #f01932 0deg 72deg,
    #ffe600 72deg 144deg,
    #00c878 144deg 216deg,
    #087cff 216deg 288deg,
    #808080 288deg 360deg
  );
  box-shadow:
    0 0 0 4px #111111,
    0 0 22px #ffe600;
}

/* El giro se ejecuta solamente cuando se agrega esta clase */
.ruleta.girando {
  animation: girarRuleta 3s cubic-bezier(0.12, 0.75, 0.18, 1) forwards;
}


@keyframes girarRuleta {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(1440deg);
  }
}

/* BOTÓN GIRAR ABAJO Y A LA DERECHA */
.ruleta-contenedor {
  margin-bottom: 75px;
}

.boton-girar {
  position: absolute;
  right: 0;
  bottom: -62px;
  z-index: 20;
  padding: 12px 22px;
  border: 3px solid #111111;
  border-radius: 10px;
  background: #f01932;
  color: #ffffff;
  font-size: clamp(18px, 2vw, 24px);
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 0 10px #ffe600, 0 4px 0 #111111;
}

.boton-girar:hover {
  background: #087cff;
  transform: scale(1.05);
}

.boton-girar:disabled {
  opacity: 0.65;
  cursor: wait;
}

/* Animación automática y manual */
.ruleta.girando {
  animation: girarRuleta 3s cubic-bezier(0.12, 0.75, 0.18, 1) forwards;
}

[hidden] {
  display: none !important;
}

@media (max-width: 650px) {
  #pantallas {
    gap: 3px;
    padding: 3px;
  }

  .lado {
    padding: 5px 3px;
    border-width: 2px;
  }

  .estadisticas {
    gap: 3px;
  }

  .estadisticas span {
    padding: 4px 3px;
    font-size: 10px;
  }

  .cuenta {
    padding: 4px;
  }

  .columnas {
    gap: 4px;
  }

  .recuadros {
    gap: 4px;
  }

  .pieza {
    padding: 6px 2px;
  }
}


/* PREGUNTA EMERGENTE DE CLASIFICACIÓN */
.pregunta-modal {
  position: absolute;
  inset: 0;
  z-index: 80;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
  background: rgba(0, 0, 0, 0.82);
}

.pregunta-caja {
  width: 100%;
  max-width: 520px;
  padding: 22px 16px;
  background: #ffffff;
  color: #111111;
  border: 6px solid #f01932;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 0 25px #f01932;
  animation: aparecerPregunta 0.35s ease-out;
}

.pregunta-caja h2 {
  margin: 0 0 14px;
  color: #ed243b;
  font-size: clamp(22px, 3vw, 32px);
}

.pregunta-caja p {
  font-size: clamp(18px, 2.5vw, 25px);
  font-weight: bold;
  margin: 12px 0 18px;
}

.alternativas-clasificacion {
  display: grid;
  gap: 10px;
}

.alternativa-clasificacion {
  width: 100%;
  padding: 13px 8px;
  border: 3px solid #222222;
  border-radius: 9px;
  background: #087cff;
  color: white;
  font-size: clamp(18px, 2.5vw, 24px);
  font-weight: 900;
  cursor: pointer;
}

.alternativa-clasificacion:hover {
  background: #087c43;
  transform: scale(1.02);
}

.alternativa-clasificacion:disabled {
  cursor: default;
  opacity: 0.8;
}

.resultado-clasificacion {
  margin-top: 15px;
  font-size: 23px;
  font-weight: 900;
}

.boton-continuar-clasificacion {
  margin-top: 15px;
  padding: 12px 22px;
  border: 3px solid #111111;
  border-radius: 9px;
  background: #00c878;
  color: #111111;
  font-size: 20px;
  font-weight: 900;
  cursor: pointer;
}

@keyframes aparecerPregunta {
  from {
    transform: scale(0.65);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}


/* SEGUNDA PREGUNTA: TIPO DE SALDO */
.saldo-caja {
  width: 100%;
  max-width: 520px;
  padding: 22px 16px;
  background: #808080;
  color: #ffffff;
  border: 6px solid #ffe600;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 0 25px #ffe600;
  animation: aparecerPregunta 0.35s ease-out;
}

.saldo-caja h2 {
  margin: 0 0 14px;
  color: #ffe600;
  font-size: clamp(22px, 3vw, 32px);
}

.saldo-caja p {
  font-size: clamp(18px, 2.5vw, 25px);
  font-weight: bold;
  margin: 12px 0 18px;
}

.alternativas-saldo {
  display: grid;
  gap: 12px;
}

.alternativa-saldo {
  width: 100%;
  padding: 15px 8px;
  border: 3px solid #ffffff;
  border-radius: 9px;
  background: #087cff;
  color: #ffffff;
  font-size: clamp(19px, 2.5vw, 26px);
  font-weight: 900;
  cursor: pointer;
}

.alternativa-saldo:hover {
  background: #087c43;
  transform: scale(1.02);
}

.alternativa-saldo:disabled {
  cursor: default;
  opacity: 0.8;
}

.resultado-saldo {
  margin-top: 15px;
  font-size: clamp(20px, 2.5vw, 25px);
  font-weight: 900;
}

.boton-continuar-saldo {
  margin-top: 15px;
  padding: 12px 22px;
  border: 3px solid #111111;
  border-radius: 9px;
  background: #ffe600;
  color: #111111;
  font-size: 20px;
  font-weight: 900;
  cursor: pointer;
}



</style>
</head>

<body>

<div id="inicio">
  <div id="robot">🤖</div>
</div>

<div id="efecto"></div>

<div id="rayo" aria-hidden="true">🛸</div>

<header>
  <h1>COMPETENCIA CUENTAS T</h1>
</header>

<main id="pantallas">

  <section class="lado" id="lado0">
 <div class="encabezado-division">
  <h2>🤩</h2>
  <div class="cronometro-division" id="cronometro0">

  </div>
</div>
    <div class="progreso" id="progreso0">EJERCICIO 1 DE 30</div>

      <span>✔️ Correctas: <b id="correctas0">0</b></span>

    </div>

<script>
"use strict";

//const TOTAL_EJERCICIOS = 30;
const TOTAL_EJERCICIOS = 7;
const TIEMPO_INICIAL = 120;

let tiempoRestante = TIEMPO_INICIAL;
let juegoActivo = false;
let temporizador = null;
let efectoTemporizador = null;

// Control independiente del rayo
let temporizadorRayo = null;
let direccionRayoIzquierda = true;
const estados = [
  crearEstado(),
  crearEstado()
];


function crearEstado() {
  return {
    ejercicios: [],
    indice: 0,
    correctas: 0,
    erradas: 0,
    seleccion: null,
    ocupados: new Set(),
    finalizado: false,
    procesando: false,
    tipoCuentaActual: null
  };
}

function azar(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}


// Mezclar piezas en orden aleatorio.
function mezclarPiezas(piezas) {
  const mezcladas = [...piezas];

  for (let i = mezcladas.length - 1; i > 0; i--) {
    const j = azar(0, i);

    [mezcladas[i], mezcladas[j]] =
      [mezcladas[j], mezcladas[i]];
  }

  return mezcladas;
}


function asignarColoresAleatorios(piezas) {
  const colores = [
    "color-1",
    "color-2",
    "color-3",
    "color-4",
    "color-5",
    "color-6"
  ];

  const coloresMezclados = mezclarPiezas(colores);

  return piezas.map((pieza, indice) => ({
    ...pieza,
    color: coloresMezclados[indice]
  }));
}


function formato(valor) {
  return "$" + valor.toLocaleString("es-CL");
}



/* BANCO DE CUENTAS PARA CLASIFICAR */
const cuentasClasificacion = [
  { nombre: "CAJA", tipo: "ACTIVO" },
  { nombre: "BANCO", tipo: "ACTIVO" },
  { nombre: "MERCADERÍAS", tipo: "ACTIVO" },
  { nombre: "VEHÍCULOS", tipo: "ACTIVO" },
  { nombre: "BIENES RAÍCES", tipo: "ACTIVO" },

  { nombre: "PROVEEDORES", tipo: "PASIVO" },

  //{ nombre: "CAPITAL", tipo: "PASIVO" },
  { nombre: "PATRIMONIO", tipo: "PASIVO" },

  { nombre: "DOCUMENTOS POR PAGAR", tipo: "PASIVO" },
  { nombre: "PRÉSTAMOS BANCARIOS", tipo: "PASIVO" }
];

/* MEZCLAR AL AZAR LAS ALTERNATIVAS */
function mezclarAlternativas(lista) {
  const copia = [...lista];

  for (let i = copia.length - 1; i > 0; i--) {
    const j = azar(0, i);
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }

  return copia;
}


/* PRESENTAR LA PREGUNTA EMERGENTE */
function mostrarPreguntaClasificacion(id) {
  const modal = document.getElementById("preguntaModal" + id);
  const estado = estados[id];
  const ejercicio = estado.ejercicios[estado.indice];

  // Obtener la pieza correspondiente al saldo.
  const piezaSaldo = ejercicio.piezas.find(
    pieza => pieza.tipo === "saldo"
  );

  // Determinar el tipo de cuenta según el lado que tiene
  // el mayor total en la Cuenta T.
  const tipoCuenta = ejercicio.tipoCuenta;

  // Guardar la clasificación para la segunda pregunta.
  estado.tipoCuentaActual = tipoCuenta;

  // Mezclar las dos alternativas.
  const alternativas = mezclarAlternativas([
    "ACTIVO",
    "PASIVO"
  ]);

  modal.innerHTML = `
    <div class="pregunta-caja">
      <h2>📘 CLASIFICACIÓN DE CUENTAS</h2>


	<p>
	    La pieza del saldo es
	    <strong>${piezaSaldo.texto}</strong>
	    <br>
	    ¿Qué tipo de cuenta representa 
	    <strong>${ejercicio.nombreCuenta}</strong>?
	</p>

      <div class="alternativas-clasificacion">
        ${alternativas.map(opcion => `
          <button
            class="alternativa-clasificacion"
            data-respuesta="${opcion}">
            ${opcion}
          </button>
        `).join("")}
      </div>

      <div
        class="resultado-clasificacion"
        id="resultadoClasificacion${id}">
      </div>

      <button
        class="boton-continuar-clasificacion"
        id="continuarClasificacion${id}"
        hidden>
        CONTINUAR ➡️
      </button>
    </div>
  `;

  modal.hidden = false;

  const botones = modal.querySelectorAll(
    ".alternativa-clasificacion"
  );

  botones.forEach(boton => {
    boton.addEventListener("click", () => {
      if (botones[0].disabled) return;

      botones.forEach(b => b.disabled = true);

      const respuesta = boton.dataset.respuesta;
      const resultado = document.getElementById(
        "resultadoClasificacion" + id
      );


if (respuesta === tipoCuenta) {
  resultado.textContent = "";
  mostrarEfecto(true);

  // Pasar automáticamente a la segunda pregunta.
  setTimeout(() => {
    modal.hidden = true;
    modal.innerHTML = "";
    mostrarPreguntaSaldo(id);
  }, 300);

} else {
  resultado.textContent =
    "❌ INCORRECTO. Respuesta: " + tipoCuenta;
  resultado.style.color = "#ed243b";

  estado.erradas++;

  document.getElementById("erradas" + id).textContent =
    estado.erradas;

  // En respuestas incorrectas, mantener visible
  // el mensaje para que se pueda leer.
  const continuar = document.getElementById(
    "continuarClasificacion" + id
  );

  continuar.hidden = false;

  continuar.addEventListener("click", () => {
    modal.hidden = true;
    modal.innerHTML = "";
    mostrarPreguntaSaldo(id);
  }, { once: true });
}


    });
  });
}



/* SEGUNDA PREGUNTA: CLASIFICAR EL TIPO DE SALDO */
function mostrarPreguntaSaldo(id) {
  const modal = document.getElementById("saldoModal" + id);
  const estado = estados[id];


  // Utilizar la clasificación guardada en la primera pregunta.
  const tipoCuenta = estado.tipoCuentaActual;

  // El saldo debe concordar con el tipo de cuenta.
  const respuestaCorrecta =
    tipoCuenta === "ACTIVO"
      ? "SALDO DEUDOR"
      : "SALDO ACREEDOR";

  // Mezclar las dos alternativas.
  const alternativas = mezclarAlternativas([
    "SALDO DEUDOR",
    "SALDO ACREEDOR"
  ]);

  modal.innerHTML = `
    <div class="saldo-caja">

      <h2>💰 TIPO DE SALDO</h2>


	<p>
	  La clasificación anterior fue
	  <strong>${tipoCuenta}</strong>.
	  <br>
	  ¿Qué tipo de saldo corresponde?
	</p>


      <div class="alternativas-saldo">
        ${alternativas.map(opcion => `
          <button
            class="alternativa-saldo"
            data-respuesta="${opcion}">
            ${opcion}
          </button>
        `).join("")}
      </div>

      <div
        class="resultado-saldo"
        id="resultadoSaldo${id}">
      </div>

      <button
        class="boton-continuar-saldo"
        id="continuarSaldo${id}"
        hidden>
        CONTINUAR ➡️
      </button>

    </div>
  `;

  modal.hidden = false;

  const botones = modal.querySelectorAll(".alternativa-saldo");

  botones.forEach(boton => {
    boton.addEventListener("click", () => {

      // Impedir que se responda más de una vez.
      if (botones[0].disabled) return;

      botones.forEach(b => b.disabled = true);

      const respuesta = boton.dataset.respuesta;

      const resultado = document.getElementById(
        "resultadoSaldo" + id
      );



if (respuesta === respuestaCorrecta) {
  resultado.textContent = "";
  mostrarEfecto(true);

  // Avanzar automáticamente al siguiente ejercicio.
  setTimeout(() => {
    modal.hidden = true;
    modal.innerHTML = "";
    avanzarEjercicio(id);
  }, 300);

} else {
  resultado.textContent =
    "❌ INCORRECTO: " + respuestaCorrecta;

  resultado.style.color = "#ff334f";

  estado.erradas++;

  document.getElementById("erradas" + id).textContent =
    estado.erradas;

  // En respuestas incorrectas, conservar el botón
  // para que se pueda leer la solución.
  const continuar = document.getElementById(
    "continuarSaldo" + id
  );

  continuar.hidden = false;

  continuar.addEventListener("click", () => {
    modal.hidden = true;
    modal.innerHTML = "";
    avanzarEjercicio(id);
  }, { once: true });
}

    });
  });
}


/* CONTINUAR DESPUÉS DE RESPONDER LA PREGUNTA */
function avanzarEjercicio(id) {
  const estado = estados[id];

  if (!juegoActivo || estado.finalizado) return;

  // Si era el último ejercicio, mostrar la nota final.
  if (estado.indice + 1 >= TOTAL_EJERCICIOS) {
    finalizarDivision(id);
    comprobarFinTotal();
    return;
  }

  // Preparar el siguiente ejercicio.
  estado.indice++;
  estado.ocupados = new Set();
  estado.seleccion = null;
  estado.procesando = false;

  dibujar(id);
}


function generarEjercicio() {
  let debe, haber, totalDebe, totalHaber, saldo;

  // Generar valores hasta que los tres resultados sean distintos.
  do {
    debe = [
      azar(1, 9) * 100,
      azar(1, 9) * 100,
      azar(1, 9) * 100
    ];

    haber = [
      azar(1, 9) * 100,
      azar(1, 9) * 100,
      azar(1, 9) * 100
    ];

    totalDebe = debe.reduce((a, b) => a + b, 0);
    totalHaber = haber.reduce((a, b) => a + b, 0);
    saldo = Math.abs(totalDebe - totalHaber);

  } while (
    new Set([totalDebe, totalHaber, saldo]).size !== 3
  );

  // Crear distractores.
  const sumaDebeHaber = totalDebe + totalHaber;

  const valoresUsados = new Set([
    totalDebe,
    totalHaber,
    saldo,
    sumaDebeHaber
  ]);

  const distractores = [sumaDebeHaber];

  while (distractores.length < 3) {
    const valor = azar(1, 27) * 100;

    if (!valoresUsados.has(valor)) {
      distractores.push(valor);
      valoresUsados.add(valor);
    }
  }

  // Determinar el tipo de cuenta según el saldo.
  const tipoCuenta =
    totalDebe > totalHaber ? "ACTIVO" : "PASIVO";

  // Seleccionar el nombre UNA SOLA VEZ por ejercicio.
  const cuentasActivo = [
    "CAJA",
    "BANCO",
    "MERCADERÍAS",
    "VEHÍCULOS",
    "BIENES RAÍCES"
  ];

  const cuentasPasivo = [
    "PROVEEDORES",
    "DOCUMENTOS POR PAGAR",
    "PRÉSTAMOS BANCARIOS"
  ];

  const listaCuentas =
    tipoCuenta === "ACTIVO"
      ? cuentasActivo
      : cuentasPasivo;

  const nombreCuenta =
    listaCuentas[azar(0, listaCuentas.length - 1)];

  // Guardar el nombre y tipo para conservarlos
  // durante todo este ejercicio.
  return {
    debe,
    haber,
    totalDebe,
    totalHaber,
    saldo,
    tipoCuenta,
    nombreCuenta,

    piezas: [
      { tipo: "debito", texto: formato(totalDebe) },
      { tipo: "credito", texto: formato(totalHaber) },
      { tipo: "saldo", texto: formato(saldo) },
      { tipo: "distractor1", texto: formato(distractores[0]) },
      { tipo: "distractor2", texto: formato(distractores[1]) },
      { tipo: "distractor3", texto: formato(distractores[2]) }
    ]
  };
}


function prepararJuego() {
  estados.forEach((estado) => {
    estado.ejercicios = Array.from(
      { length: TOTAL_EJERCICIOS },
      () => generarEjercicio()
    );

    estado.indice = 0;
    estado.correctas = 0;
    estado.erradas = 0;
    estado.seleccion = null;
    estado.ocupados = new Set();
    estado.finalizado = false;
    estado.procesando = false;
  });

  juegoActivo = true;

	// Lanzar un rayo cada 5 segundos
	clearInterval(temporizadorRayo);

	direccionRayoIzquierda = true;

	temporizadorRayo = setInterval(() => {
	  if (!juegoActivo) return;
	  lanzarRayo();
	}, 5000);


  tiempoRestante = TIEMPO_INICIAL;
  actualizarCronometro();

  dibujar(0);
  dibujar(1);

  temporizador = setInterval(() => {
    if (!juegoActivo) return;

    tiempoRestante--;
    actualizarCronometro();

    if (tiempoRestante <= 0) {
      terminarJuego();
    }
  }, 1000);
}

function actualizarCronometro() {
  const color = tiempoRestante <= 20
    ? "#ff334f"
    : "#ffffff";

  // Actualizar el cronómetro de ambas divisiones
  [0, 1].forEach((id) => {
    const elemento = document.getElementById("cronometro" + id);

    elemento.textContent = "⏱️ " + tiempoRestante + " segundos";
    elemento.style.color = color;
  });
}


function dibujar(id) {
  const estado = estados[id];

  if (estado.finalizado) return;

  const ejercicio = estado.ejercicios[estado.indice];

  document.getElementById("progreso" + id).textContent =
    "EJERCICIO " + (estado.indice + 1) +
    " DE " + TOTAL_EJERCICIOS;

  document.getElementById("correctas" + id).textContent =
    estado.correctas;

  document.getElementById("erradas" + id).textContent =
    estado.erradas;

  const contenido = document.getElementById("contenido" + id);

  contenido.innerHTML = `

  <div class="cuenta">
     <h3>${ejercicio.nombreCuenta}</h3>
      <div class="columnas">
        <div class="columna debe">
          <h4>DEBE</h4>
          <div class="valores">
            ${ejercicio.debe.map(formato).join("<br>")}
          </div>
        </div>

        <div class="columna haber">
          <h4>HABER</h4>
          <div class="valores">
            ${ejercicio.haber.map(formato).join("<br>")}
          </div>
        </div>
      </div>

      <div class="recuadros">
        <button class="recuadro ${
          estado.ocupados.has("debito") ? "lleno" : ""
        }"
          data-slot="debito"
          ${estado.ocupados.has("debito") ? "disabled" : ""}>
          ${

	estado.ocupados.has("debito")
	  ? '✔️ <span class="valor-destino">' +
	      formato(ejercicio.totalDebe) + '</span>'
	  : "UBICAR DÉBITO"
          }
        </button>

        <button class="recuadro ${
          estado.ocupados.has("credito") ? "lleno" : ""
        }"
          data-slot="credito"
          ${estado.ocupados.has("credito") ? "disabled" : ""}>
          ${

	estado.ocupados.has("credito")
	  ? '✔️ <span class="valor-destino">' +
	      formato(ejercicio.totalHaber) + '</span>'
	  : "UBICAR CRÉDITO"
          }
        </button>

        <button class="recuadro saldo ${
          estado.ocupados.has("saldo") ? "lleno" : ""
        }"
          data-slot="saldo"
          ${estado.ocupados.has("saldo") ? "disabled" : ""}>
          ${

	estado.ocupados.has("saldo")
	  ? '✔️ <span class="valor-destino">' +
	      formato(ejercicio.saldo) + '</span>'
	  : "UBICAR SALDO"
          }
        </button>
      </div>
    </div>

    <div class="piezas-titulo">
      SELECCIONA UNA PIEZA Y LUEGO SU RECUADRO
    </div>


<div class="piezas">
  ${asignarColoresAleatorios(
    mezclarPiezas(ejercicio.piezas)
  ).map((pieza) => `
    <button
      class="pieza ${pieza.color}"
      data-tipo="${pieza.tipo}"
      ${estado.ocupados.has(pieza.tipo) ? "disabled" : ""}>
      ${pieza.texto}
    </button>
  `).join("")}
</div>

  `;

  contenido.querySelectorAll(".pieza").forEach((boton) => {
    boton.addEventListener("click", () => {
      seleccionarPieza(id, boton.dataset.tipo);
    });
  });

  contenido.querySelectorAll(".recuadro").forEach((boton) => {
    boton.addEventListener("click", () => {
      colocarPieza(id, boton.dataset.slot);
    });
  });

  actualizarSeleccion(id);
}

function seleccionarPieza(id, tipo) {
  const estado = estados[id];

  if (
    !juegoActivo ||
    estado.finalizado ||
    estado.procesando ||
    estado.ocupados.has(tipo)
  ) return;

  estado.seleccion = tipo;
  actualizarSeleccion(id);
}

function actualizarSeleccion(id) {
  const estado = estados[id];
  const contenido = document.getElementById("contenido" + id);

  contenido.querySelectorAll(".pieza").forEach((boton) => {
    boton.classList.toggle(
      "elegida",
      boton.dataset.tipo === estado.seleccion
    );
  });

  contenido.querySelectorAll(".recuadro").forEach((boton) => {
    boton.classList.toggle(
      "seleccionado",
      boton.dataset.slot === estado.seleccion
    );
  });
}

function colocarPieza(id, slot) {
  const estado = estados[id];

  if (
    !juegoActivo ||
    estado.finalizado ||
    estado.procesando ||
    !estado.seleccion ||
    estado.ocupados.has(slot)
  ) return;

  const tipoSeleccionado = estado.seleccion;

if (
  tipoSeleccionado !== slot ||
  tipoSeleccionado.startsWith("distractor")
) {
  estado.erradas++;
  estado.seleccion = null;

  document.getElementById("erradas" + id).textContent =
    estado.erradas;

  actualizarSeleccion(id);
  mostrarEfecto(false);
  return;
}


  estado.ocupados.add(slot);
  estado.seleccion = null;

  mostrarEfecto(true);
  dibujar(id);

	if (estado.ocupados.size === 3) {
	  estado.correctas++;
	  estado.procesando = true;

	  document.getElementById("correctas" + id).textContent =
	    estado.correctas;

	  // Mostrar la pregunta después de completar la Cuenta T.
	  setTimeout(() => {
	    if (!juegoActivo || estado.finalizado) return;

	    mostrarPreguntaClasificacion(id);
	  }, 350);
	}

}


function lanzarRayo() {
  if (!juegoActivo) return;

  const rayo = document.getElementById("rayo");

  // Reiniciar la animación sin bloquear el juego
  rayo.className = "rayo";
  void rayo.offsetWidth;

  if (direccionRayoIzquierda) {
    rayo.classList.add("hacia-izquierda");
  } else {
    rayo.classList.add("hacia-derecha");
  }

  // Alternar la dirección para el próximo rayo
  direccionRayoIzquierda = !direccionRayoIzquierda;
}


function mostrarEfecto(correcto) {
  const elemento = document.getElementById("efecto");

  clearTimeout(efectoTemporizador);

  elemento.className = "";
  elemento.textContent = correcto ? "✔️" : "❌";

  // Reiniciar la animación.
  void elemento.offsetWidth;

  elemento.className =
    "mostrar " + (correcto ? "correcto" : "incorrecto");

  efectoTemporizador = setTimeout(() => {
    elemento.className = "";
  }, 300);
}

function calcularNota(correctas, erradas) {
  // Escala chilena de 1,0 a 7,0.
  let descuento = erradas * 0.3; // 0.3 por cada error
  return ((1 + 6 * correctas / TOTAL_EJERCICIOS) - descuento)
    .toFixed(1)
    .replace(".", ",");
}

function finalizarDivision(id) {
  const estado = estados[id];

  if (estado.finalizado) return;

  estado.finalizado = true;
  estado.procesando = true;

  document.getElementById("contenido" + id).hidden = true;
  document.getElementById("progreso" + id).hidden = true;

  const estadisticas = document.querySelector(
    "#lado" + id + " .estadisticas"
  );
  estadisticas.hidden = true;

const final = document.getElementById("final" + id);



const notaFinal = calcularNota(
  estado.correctas,
  estado.erradas
);

final.innerHTML = `
  <div>🏆 NOTA FINAL 🏆</div>

  <div class="ruleta-contenedor">
    <div class="puntero-ruleta"></div>

    <!-- La clase girando conserva el giro automático -->
    <div class="ruleta girando"></div>

    <div class="nota-centro">
      <span class="valor-nota">${notaFinal}</span>
    </div>

    <button
      type="button"
      class="boton-girar">
      🎯 GIRAR
    </button>
  </div>
`;

final.hidden = false;

const botonGirar = final.querySelector(".boton-girar");

botonGirar.addEventListener("click", () => {
  girarRuleta(id);
});

// Bloquear el botón mientras se ejecuta el giro inicial.
botonGirar.disabled = true;

const ruleta = final.querySelector(".ruleta");

ruleta.addEventListener("animationend", () => {
  botonGirar.disabled = false;
}, { once: true });

}

function girarRuleta(id) {
  const final = document.getElementById("final" + id);

  if (!final || final.hidden) return;

  const ruleta = final.querySelector(".ruleta");
  const boton = final.querySelector(".boton-girar");

  if (!ruleta || !boton || boton.disabled) return;

  // Bloquear el botón durante el giro.
  boton.disabled = true;

  // Quitar la animación anterior.
  ruleta.classList.remove("girando");

  // Forzar al navegador a reiniciar la animación.
  void ruleta.offsetWidth;

  // Iniciar un nuevo giro.
  ruleta.classList.add("girando");

  ruleta.addEventListener("animationend", function habilitarBoton() {
    boton.disabled = false;
  }, { once: true });
}


function comprobarFinTotal() {
  if (estados.every((estado) => estado.finalizado)) {
	juegoActivo = false;
	clearInterval(temporizador);
	clearInterval(temporizadorRayo);  }
}

function terminarJuego() {
  if (!juegoActivo) return;

	juegoActivo = false;
	clearInterval(temporizador);
	clearInterval(temporizadorRayo);

  estados.forEach((estado, id) => {
    if (!estado.finalizado) {
      finalizarDivision(id);
    }
  });
}

// El juego comienza después de la animación inicial de 1 segundo.
window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById("inicio").remove();
    prepararJuego();
  }, 1000);
});
</script>
